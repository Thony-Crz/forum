<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Topics Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .controls label {
            font-weight: bold;
            color: #555;
        }

        .controls input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .controls button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .timer-section {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .timer-display {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .timer-display.warning {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .timer-controls {
            display: flex;
            gap: 10px;
        }

        .grid-container {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .grid-cell {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            min-height: 120px;
            position: relative;
            transition: all 0.3s;
            cursor: pointer;
        }

        .grid-cell:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .grid-cell.filled {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-color: #667eea;
        }

        .cell-content {
            width: 100%;
            height: 100%;
            min-height: 80px;
            border: none;
            background: transparent;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            color: #333;
        }

        .cell-content::placeholder {
            color: #adb5bd;
        }

        .cell-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: none;
            gap: 5px;
        }

        .grid-cell:hover .cell-actions {
            display: flex;
        }

        .cell-actions button {
            padding: 5px 8px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .cell-actions button:hover {
            background: #c82333;
        }

        .stats {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            color: #555;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Forum Topics Grid</h1>
        
        <div class="controls">
            <label for="rows">Lignes:</label>
            <input type="number" id="rows" value="6" min="1" max="20">
            
            <label for="cols">Colonnes:</label>
            <input type="number" id="cols" value="3" min="1" max="10">
            
            <button onclick="updateGrid()">Mettre à jour la grille</button>
            <button onclick="clearGrid()">Effacer tout</button>
        </div>

        <div class="timer-section">
            <div class="timer-display" id="timerDisplay">30:00</div>
            <div class="timer-controls">
                <button onclick="startTimer()">▶️ Démarrer</button>
                <button onclick="pauseTimer()">⏸️ Pause</button>
                <button onclick="resetTimer()">🔄 Réinitialiser</button>
            </div>
        </div>

        <div class="grid-container" id="gridContainer"></div>

        <div class="stats">
            <span id="stats">0 sujet(s) sur 0 cellules</span>
        </div>

        <div class="footer">
            💡 Cliquez sur une cellule pour ajouter ou modifier un sujet de forum
        </div>
    </div>

    <script>
        // Configuration
        let rows = 6;
        let cols = 3;
        let timerSeconds = 1800; // 30 minutes in seconds
        let timerInterval = null;
        let isTimerRunning = false;
        let remainingSeconds = timerSeconds;

        // Load data from localStorage
        function loadData() {
            const saved = localStorage.getItem('forumGrid');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    rows = data.rows || 6;
                    cols = data.cols || 3;
                    document.getElementById('rows').value = rows;
                    document.getElementById('cols').value = cols;
                    return data.cells || {};
                } catch (e) {
                    console.error('Error loading data:', e);
                }
            }
            return {};
        }

        // Save data to localStorage
        function saveData() {
            const cells = {};
            document.querySelectorAll('.cell-content').forEach((textarea, index) => {
                if (textarea.value.trim()) {
                    cells[index] = textarea.value;
                }
            });
            
            const data = {
                rows: rows,
                cols: cols,
                cells: cells
            };
            
            localStorage.setItem('forumGrid', JSON.stringify(data));
            updateStats();
        }

        // Update statistics
        function updateStats() {
            const totalCells = rows * cols;
            const filledCells = document.querySelectorAll('.grid-cell.filled').length;
            document.getElementById('stats').textContent = 
                `${filledCells} sujet(s) sur ${totalCells} cellule(s)`;
        }

        // Create grid
        function createGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            
            const savedCells = loadData();
            const totalCells = rows * cols;
            
            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                
                const textarea = document.createElement('textarea');
                textarea.className = 'cell-content';
                textarea.placeholder = `Sujet ${i + 1}...`;
                textarea.value = savedCells[i] || '';
                
                if (textarea.value.trim()) {
                    cell.classList.add('filled');
                }
                
                textarea.addEventListener('input', function() {
                    if (this.value.trim()) {
                        cell.classList.add('filled');
                    } else {
                        cell.classList.remove('filled');
                    }
                    saveData();
                });
                
                const actions = document.createElement('div');
                actions.className = 'cell-actions';
                
                const clearBtn = document.createElement('button');
                clearBtn.textContent = '✖';
                clearBtn.onclick = function(e) {
                    e.stopPropagation();
                    textarea.value = '';
                    cell.classList.remove('filled');
                    saveData();
                };
                
                actions.appendChild(clearBtn);
                cell.appendChild(textarea);
                cell.appendChild(actions);
                container.appendChild(cell);
            }
            
            updateStats();
        }

        // Update grid dimensions
        function updateGrid() {
            const newRows = parseInt(document.getElementById('rows').value);
            const newCols = parseInt(document.getElementById('cols').value);
            
            if (newRows > 0 && newCols > 0 && newRows <= 20 && newCols <= 10) {
                rows = newRows;
                cols = newCols;
                createGrid();
                saveData();
            } else {
                alert('Veuillez entrer des valeurs valides (Lignes: 1-20, Colonnes: 1-10)');
            }
        }

        // Clear all grid
        function clearGrid() {
            if (confirm('Êtes-vous sûr de vouloir effacer tous les sujets ?')) {
                localStorage.removeItem('forumGrid');
                createGrid();
            }
        }

        // Timer functions
        function updateTimerDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            const timerDisplay = document.getElementById('timerDisplay');
            timerDisplay.textContent = display;
            
            if (remainingSeconds <= 300 && remainingSeconds > 0) { // Last 5 minutes
                timerDisplay.classList.add('warning');
            } else {
                timerDisplay.classList.remove('warning');
            }
            
            if (remainingSeconds === 0) {
                pauseTimer();
                alert('⏰ Le temps est écoulé !');
            }
        }

        function startTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    if (remainingSeconds > 0) {
                        remainingSeconds--;
                        updateTimerDisplay();
                    } else {
                        pauseTimer();
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            isTimerRunning = false;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimer() {
            pauseTimer();
            remainingSeconds = timerSeconds;
            updateTimerDisplay();
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            createGrid();
            updateTimerDisplay();
        });

        // Handle page visibility changes
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && isTimerRunning) {
                pauseTimer();
            }
        });
    </script>
</body>
</html>
